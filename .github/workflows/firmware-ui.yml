name: Firmware and Deck UI

on:
  pull_request:
    paths:
      - ".github/workflows/firmware-ui.yml"
      - "firmware/**"
      - "protocol/**"
      - "tests/host/**"
      - "tools/idf.sh"
      - "tools/generate_m0_font.sh"
      - "tools/hil_ui_preview.py"
      - "docs/deck-ui.md"
      - "docs/research/deck-cjk-fonts.md"
      - "docs/acceptance/ui-frames/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/firmware-ui.yml"
      - "firmware/**"
      - "protocol/**"
      - "tests/host/**"
      - "tools/idf.sh"
      - "tools/generate_m0_font.sh"
      - "tools/hil_ui_preview.py"
      - "docs/deck-ui.md"
      - "docs/research/deck-cjk-fonts.md"
      - "docs/acceptance/ui-frames/**"

permissions:
  contents: read

concurrency:
  group: firmware-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Host contracts and ESP-IDF 6.0.2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    container:
      image: espressif/idf:v6.0.2
      env:
        HOME: /tmp
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6

      - name: Verify pinned toolchain
        run: |
          source "$IDF_PATH/export.sh" >/dev/null
          idf.py --version | grep -F "ESP-IDF v6.0.2"

      - name: Run Host and UI contracts
        run: |
          source "$IDF_PATH/export.sh" >/dev/null
          ./tools/test_host.sh

      - name: Build development firmware
        run: |
          source "$IDF_PATH/export.sh" >/dev/null
          ./tools/idf.sh dev build

      - name: Build release firmware
        run: |
          source "$IDF_PATH/export.sh" >/dev/null
          ./tools/idf.sh release build

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: s3-rlcd-deck-firmware-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/dev/s3_rlcd_deck.bin
            build/dev/s3_rlcd_deck.elf
            build/dev/partition_table/partition-table.bin
            build/release/s3_rlcd_deck.bin
            build/release/s3_rlcd_deck.elf
            build/release/partition_table/partition-table.bin
